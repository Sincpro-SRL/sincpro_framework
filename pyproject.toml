[tool.poetry]
name = "sincpro-framework"
version = "3.7.0"
description = "Sincpro framework to use DDD, Clean architecture, Hexagonal architecture"
authors = ["Gutierrez Andres <andru1236@gmail.com>"]
readme = "README.md"
packages = [{include = "sincpro_framework"}]
license = "MIT"

[[tool.poetry.source]]
name = "fury"
url = "https://pypi.fury.io/sincpro/"
priority = "supplemental"

[tool.poetry.dependencies]
python = "^3.12"
dependency-injector = "^4.49.1"
pydantic = "^2.13.5"
pyyaml = ">=6.0.1"
sincpro-log = "^1.2.1"
opentelemetry-api = {version = ">=1.20", optional = true}
opentelemetry-sdk = {version = ">=1.20", optional = true}
opentelemetry-exporter-otlp-proto-grpc = {version = ">=1.20", optional = true}
opentelemetry-exporter-otlp-proto-http = {version = ">=1.20", optional = true}
sentry-sdk = {version = ">=2.0", optional = true}
fastmcp = {version = ">=3.0,<4", optional = true}
starlette = {version = ">=1.0", optional = true}
uvicorn = {version = ">=0.35", optional = true}
sqlalchemy = {version = ">=2.0", optional = true}

[tool.poetry.extras]
opentelemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]
sentry = ["sentry-sdk"]
mcp = ["fastmcp"]
rpc = ["starlette", "uvicorn"]
sqlalchemy = ["sqlalchemy"]

[tool.poetry.group.dev.dependencies]
isort = "^9.0.1"
black = "^26.5.1"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ipython = "^9.17.1"
autoflake = "^2.4.0"
pyright = "^1.1.413"
jupyterlab = "^4.6.3"
mypy = "^2.3.1"
urllib3 = ">=2.7.0"
nbconvert = ">=7.17.1"
opentelemetry-api = ">=1.20"
opentelemetry-sdk = ">=1.20"
opentelemetry-exporter-otlp-proto-grpc = ">=1.20"
opentelemetry-exporter-otlp-proto-http = ">=1.20"
sentry-sdk = ">=2.0"
sqlalchemy = ">=2.0"
hypothesis = ">=6.100"
psycopg = {version = ">=3.2", extras = ["binary"]}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 94

[tool.pyright]
venvPath = "."
venv = ".venv"
reportInvalidTypeVarUse = "none"
reportInvalidTypeForm = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realworld: end-to-end cases over a populated ledger; `make test-realworld`",
    "stress: the real-world cases at volume, timed; `make test-stress`",
]
filterwarnings = [
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal:sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["sincpro_framework"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
