[tool.poetry]
name = "sincpro-framework"
version = "3.6.0"
description = "Sincpro framework to use DDD, Clean architecture, Hexagonal architecture"
authors = ["Gutierrez Andres <andru1236@gmail.com>"]
readme = "README.md"
packages = [{include = "sincpro_framework"}]
license = "MIT"

[[tool.poetry.source]]
name = "fury"
url = "https://pypi.fury.io/sincpro/"
priority = "supplemental"

# PYTHON 3.14 FREE-THREADING: verified (3.14.7 / 3.14.7t) that every dependency
# below installs cleanly on regular (GIL) 3.14 with no code changes — full test
# suite green. On a free-threaded (`python3.14t`) interpreter, `dependency-injector`
# (core, required — see ioc.py) and, if the `opentelemetry` extra's grpc exporter
# is used, `grpcio` (transitive dep of opentelemetry-exporter-otlp-proto-grpc)
# both lack a free-threaded wheel today and force CPython to silently re-enable
# the GIL for the whole process on import. Free-threading itself is not
# implemented/targeted in this codebase yet — this is a known current gap in
# the dependency ecosystem, not something to work around here.
[tool.poetry.dependencies]
python = "^3.12"
dependency-injector = "^4.49.1"
pydantic = "^2.13.5"
pyyaml = ">=6.0.1"
sincpro-log = "^1.2.1"
opentelemetry-api = {version = ">=1.20", optional = true}
opentelemetry-sdk = {version = ">=1.20", optional = true}
opentelemetry-exporter-otlp-proto-grpc = {version = ">=1.20", optional = true}
opentelemetry-exporter-otlp-proto-http = {version = ">=1.20", optional = true}
sentry-sdk = {version = ">=2.0", optional = true}
fastmcp = {version = ">=3.0,<4", optional = true}
starlette = {version = ">=1.0", optional = true}
uvicorn = {version = ">=0.35", optional = true}

[tool.poetry.extras]
opentelemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-otlp-proto-http",
]
sentry = ["sentry-sdk"]
mcp = ["fastmcp"]
rpc = ["starlette", "uvicorn"]

[tool.poetry.group.dev.dependencies]
isort = "^9.0.1"
black = "^26.5.1"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ipython = "^9.17.1"
autoflake = "^2.4.0"
pyright = "^1.1.413"
jupyterlab = "^4.6.3"
mypy = "^2.3.1"
mkdocs = ">=1.6.1,<2.0.0"
mkdocs-material = "^9.7.7"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}
mkdocstrings-python = "^2.0.8"
pymdown-extensions = "^11.0.2"
# griffe 2.x was renamed to griffelib; mkdocstrings-python 2.x requires griffelib>=2.0
griffelib = ">=2.3.0,<3.0.0"
urllib3 = ">=2.7.0"
nbconvert = ">=7.17.1"
opentelemetry-api = ">=1.20"
opentelemetry-sdk = ">=1.20"
opentelemetry-exporter-otlp-proto-grpc = ">=1.20"
opentelemetry-exporter-otlp-proto-http = ">=1.20"
sentry-sdk = ">=2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 94

[tool.pyright]
venvPath = "."
venv = ".venv"
reportInvalidTypeVarUse = "none"
reportInvalidTypeForm = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sincpro_framework"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
